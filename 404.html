<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found, Sohaib Aref</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#000000">
<script>if(!matchMedia("(prefers-reduced-motion:reduce)").matches)document.documentElement.classList.add("intro")</script>
<style>
@font-face{font-family:Inter;src:url(/fonts/inter-var.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Martian Mono";src:url(/fonts/martian-mono-400.woff2) format("woff2");font-weight:400;font-display:swap}
*{box-sizing:border-box;margin:0}
body{background:#000;color:#fff;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.page{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:clamp(32px,5vw,72px);padding:40px}
.mark{font-weight:900;font-size:13.6vw;line-height:.8;letter-spacing:-.035em;text-transform:uppercase;white-space:nowrap;margin-left:-.04em;padding-top:.06em}
.mono{font-family:"Martian Mono",ui-monospace,monospace;font-size:clamp(11px,.2vw + 8.2px,12px);letter-spacing:.02em;text-transform:uppercase;line-height:1.6}
.dim{color:#8a8a8a}
.body{max-width:44ch}
.body .mono{margin-bottom:12px}
.lead{font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.2;margin-bottom:14px}
.body p.txt{font-size:15px;line-height:1.55;color:#c9c9c9;text-wrap:pretty}
.foot{margin-top:auto}
.links{display:flex;gap:12px 24px;flex-wrap:wrap}
a{color:#fff;text-decoration:none;border-bottom:1px solid #444;padding-bottom:2px;transition:border-color .3s}
a:hover{border-color:#fff}
a:focus-visible{outline:1px solid #fff;outline-offset:4px}
@keyframes focus{0%{opacity:0;filter:blur(var(--b));transform:translateY(var(--y,0)) scale(var(--s,1))}55%{opacity:1}100%{opacity:1;filter:blur(0);transform:none}}
html.intro .mark>span{display:inline-block;--b:.1em;--s:1.04;animation:focus 2s cubic-bezier(.22,1,.36,1) .05s both paused}
html.intro .body{--b:9px;--y:12px;animation:focus 1.7s cubic-bezier(.22,1,.36,1) .45s both paused}
html.intro .foot{--b:6px;animation:focus 1.5s cubic-bezier(.22,1,.36,1) .8s both paused}
html.intro.go .mark>span,html.intro.go .body,html.intro.go .foot{animation-play-state:running}
@media (max-width:810px){.page{padding:20px;gap:40px}}
</style>
</head>
<body>
<main class="page">
  <h1 class="mark"><span data-fit>404</span></h1>
  <section class="body">
    <p class="mono dim">Not found</p>
    <p class="lead">This page does not exist.</p>
    <p class="txt">The site is still being built. <a href="/">Go back to the start</a>.</p>
  </section>
  <footer class="foot"><p class="mono links"><a href="/">Home</a><a href="/workshops.html">Workshops</a><a href="mailto:hello@sohaib-aref.com">hello@sohaib-aref.com</a><a href="https://www.instagram.com/sohaib_creative/" target="_blank" rel="noopener">Instagram</a><a href="https://www.linkedin.com/in/sohaib-creative/" target="_blank" rel="noopener">LinkedIn</a></p></footer>
</main>
<script>
(function(){
  var el=document.querySelector('[data-fit]'),box=el.parentNode;
  function fit(){
    box.style.fontSize='100px';
    var w=box.parentNode.clientWidth-parseFloat(getComputedStyle(box.parentNode).paddingLeft)-parseFloat(getComputedStyle(box.parentNode).paddingRight),r=document.createRange();
    r.selectNodeContents(el);
    box.style.fontSize=Math.min(100*w/r.getBoundingClientRect().width*0.995,innerHeight*0.42)+'px';
  }
  fit();window.addEventListener('resize',fit);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
})();
</script>
<script>
(function(){var h=document.documentElement;if(!h.classList.contains('intro'))return;var d=false;function go(){if(d)return;d=true;requestAnimationFrame(function(){h.classList.add('go')})}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(go);setTimeout(go,1600)})();
</script>
</body>
</html>
