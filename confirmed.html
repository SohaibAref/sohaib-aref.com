<meta name="robots" content="noindex">
<style>
@font-face{font-family:Inter;src:url(fonts/inter-var.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Martian Mono";src:url(fonts/martian-mono-400.woff2) format("woff2");font-weight:400;font-display:swap}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
html,body{overflow-x:clip}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit}
.page{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:40px}
.mono{font-family:"Martian Mono",ui-monospace,monospace;font-size:clamp(11px,.2vw + 8.2px,12px);letter-spacing:.02em;text-transform:uppercase;line-height:1.6}
.dim{color:#8a8a8a}
.txt{font-size:clamp(15px,.35vw + 11px,17px);line-height:1.6;color:#c9c9c9;text-wrap:pretty}
a{color:#fff;text-decoration:none;border-bottom:1px solid #444;padding-bottom:2px;transition:border-color .3s,color .3s,background-color .3s}
a:hover{border-color:#fff}
a:focus-visible,button:focus-visible{outline:1px solid #fff;outline-offset:4px}
.foot{margin-top:clamp(56px,7vw,112px)}
.links{display:flex;gap:12px 24px;flex-wrap:wrap}
.btn{display:inline-flex;justify-content:space-between;align-items:center;gap:28px;background:#fff;color:#000;border:1px solid #fff;padding:17px 20px;cursor:pointer;transition:background-color .35s,color .35s}
.btn .arr{display:inline-flex;transition:transform .45s cubic-bezier(.16,1,.3,1)}
.ico,.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.i{width:24px;height:24px}
/* the scroll cue: shows only when the next part of the page is still below the screen */
.cue{position:fixed;right:40px;bottom:32px;z-index:40;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.28);cursor:pointer;opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .6s,transform .7s cubic-bezier(.16,1,.3,1),background-color .3s,color .3s}
.cue.on{opacity:1;transform:none;pointer-events:auto}
.cue .ico{width:18px;height:18px;animation:cue 2s cubic-bezier(.65,0,.35,1) infinite}
@keyframes cue{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}70%{transform:translateY(4px);opacity:1}100%{transform:translateY(8px);opacity:0}}
@media (hover:hover){
.btn:hover{background:transparent;color:#fff;border-color:#fff}
.btn:hover .arr{transform:translateX(4px)}
.btn:hover .arr--d{transform:translateY(3px)}
.cue:hover{background:#fff;color:#000;border-color:#fff}
}

/* the card: a calm black panel that fills white from the bottom on hover. Number, title, topics as icons, arrow. */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,1.2vw,20px)}
.card{position:relative;isolation:isolate;display:flex;flex-direction:column;min-height:clamp(380px,31vw,520px);padding:clamp(20px,1.8vw,28px);background:#0a0a0a;border:1px solid #222;color:#fff;overflow:hidden;transition:color .5s cubic-bezier(.65,0,.35,1),border-color .5s}
.card::before{content:"";position:absolute;inset:0;z-index:-1;background:#fff;transform:scaleY(0);transform-origin:50% 100%;transition:transform .6s cubic-bezier(.65,0,.35,1)}
.card:active{border-color:#8a8a8a}
.card:active .card__go{background:#fff;border-color:#fff;color:#000}
.card__num{font-weight:200;font-size:clamp(64px,6.4vw,120px);line-height:.8;letter-spacing:-.06em;color:#2a2a2a;margin:0 0 0 -.06em;transition:color .5s}
.card__title{font-weight:900;font-size:clamp(32px,3.3vw,60px);line-height:.88;letter-spacing:-.04em;text-transform:uppercase;margin:auto 0 0 -.04em;padding-top:40px}
.card__foot{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:clamp(22px,2.2vw,36px)}
.card__icons{display:flex;gap:clamp(12px,1.1vw,18px);color:#6a6a6a;transition:color .5s}
.card__icons .i{width:22px;height:22px}
.card__go{flex:none;margin-left:auto;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;border:1px solid #3a3a3a;transition:background-color .5s,border-color .5s,color .5s}
.card__go .ico{transition:transform .5s cubic-bezier(.16,1,.3,1)}
@media (hover:hover){
.card:hover{color:#000;border-color:#fff}
.card:hover::before{transform:scaleY(1)}
.card:hover .card__num{color:#d4d4d4}
.card:hover .card__icons{color:#000}
.card:hover .card__go{background:#000;border-color:#000;color:#fff}
.card:hover .card__go .ico{transform:translateX(3px)}
}
/* the small card, for the other workshops: number, title, arrow */
.card--small{min-height:clamp(200px,16vw,260px)}
.card--small .card__num{font-family:"Martian Mono",ui-monospace,monospace;font-weight:400;font-size:12px;letter-spacing:.02em;line-height:1;margin:0;color:#6a6a6a}
.card--small .card__title{font-size:clamp(26px,2.4vw,40px)}
.card--small .card__title{padding-right:64px}
.card--small .card__foot{position:absolute;right:clamp(20px,1.8vw,28px);bottom:clamp(20px,1.8vw,28px);margin:0}

/* one slim bar on every workshop page: where you are, and the way back */
.bar{position:sticky;top:0;z-index:50;background:rgba(0,0,0,.8);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color .3s;view-transition-name:bar}
.bar.scrolled{border-bottom-color:#1f1f1f}
.bar__in{display:flex;align-items:center;justify-content:space-between;gap:16px;height:56px;padding:0 40px}
.crumbs{display:flex;align-items:center;list-style:none;padding:0;min-width:0}
.crumbs li{display:flex;align-items:center;white-space:nowrap}
.crumbs li+li::before{content:"/";color:#3d3d3d;margin:0 12px}
.crumbs a,.crumbs__back,.bar__link{border:0;padding:8px 0;color:#8a8a8a}
.crumbs a:hover,.crumbs__back:hover,.bar__link:hover{color:#fff}
.crumbs [aria-current]{color:#fff}
.crumbs__back{display:none;align-items:center;gap:8px}
.crumbs__back .ico{width:14px;height:14px}
.bar__cta{border:1px solid #fff;padding:9px 14px;background:#fff;color:#000;white-space:nowrap;transition:opacity .35s,background-color .3s,color .3s}
@media (hover:hover){
.bar__cta:hover{background:transparent;color:#fff;border-color:#fff}
}
.bar__cta.off{opacity:0;pointer-events:none}
@view-transition{navigation:auto}
::view-transition-old(root),::view-transition-new(root){animation-duration:.32s}
@keyframes focus{0%{opacity:0;filter:blur(var(--b));transform:translateY(var(--y,0)) scale(var(--s,1))}55%{opacity:1}100%{opacity:1;filter:blur(0);transform:none}}
html.intro .reveal{opacity:0}
html.intro .reveal.in{--b:10px;--y:24px;animation:focus 1.5s cubic-bezier(.22,1,.36,1) var(--d,0s) both}
@media (max-width:960px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.card{min-height:360px}.card:last-child:nth-child(odd){grid-column:1/-1;min-height:280px}.card--small{min-height:0}}
@media (max-width:600px){.cards{grid-template-columns:minmax(0,1fr)}.card,.card:last-child:nth-child(odd){min-height:300px}}
@media (max-width:810px){.page{padding:20px 20px 28px}.bar__in{padding:0 20px;height:52px}.links a{padding:7px 0}}
@media (max-width:640px){.bar--detail .crumbs{display:none}.bar--detail .crumbs__back{display:inline-flex}}
@media (hover:none),(max-width:810px){html.intro .reveal.in{--b:0px;--y:14px;animation-duration:.8s;animation-delay:0s}html.intro .reveal.in .ws__title{animation:none}}
@media (prefers-reduced-motion:reduce){.cue .ico,.board__wrap.nudge .board__nav--next .ico{animation:none}}
@media (max-width:640px){.cue{right:20px;bottom:20px}}
@media (max-width:600px){.card,.card:last-child:nth-child(odd){min-height:280px}.card--small{min-height:0}.card__title{padding-top:28px}}

.steps{list-style:none;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 clamp(10px,1.6vw,24px);margin:clamp(32px,4vw,56px) 0 0;max-width:52em;counter-reset:s}
.steps li{border-top:1px solid #333;padding-top:14px;color:#6f6f6f;display:flex;flex-direction:column;gap:10px;transition:color .4s,border-color .4s}
.steps .mk{width:22px;height:22px;border-radius:50%;border:1px solid #444;display:grid;place-items:center}
.steps .mk svg{width:12px;height:12px;fill:none;stroke:#000;stroke-width:2.4;stroke-linecap:square;opacity:0}
.steps .done{color:#fff;border-color:#fff}
.steps .done .mk{background:#fff;border-color:#fff}
.steps .done .mk svg{opacity:1}
.steps .now{color:#fff;border-color:#fff}
.steps .now .mk{border-color:#fff;position:relative}
.steps .now .mk::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.6);opacity:.5}50%{transform:scale(1);opacity:1}}
.tick{display:block;width:clamp(56px,6vw,84px);height:auto;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:square;margin-bottom:clamp(20px,2.4vw,32px)}
.tick circle{stroke-dasharray:190;stroke-dashoffset:0}
.tick path{stroke-dasharray:42;stroke-dashoffset:0}
@media (prefers-reduced-motion:no-preference){
.tick circle{animation:draw 1s cubic-bezier(.65,0,.35,1) .15s both}
.tick path{animation:draw2 .55s cubic-bezier(.65,0,.35,1) .95s both}
}
@keyframes draw{from{stroke-dashoffset:190}to{stroke-dashoffset:0}}
@keyframes draw2{from{stroke-dashoffset:42}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.steps .now .mk::after{animation:none}}
@media (max-width:480px){.steps{gap:0 8px}.steps li{font-size:10px}}

.mark{font-weight:900;font-size:13.6vw;line-height:.8;letter-spacing:-.035em;text-transform:uppercase;white-space:nowrap;margin-left:-.04em;padding-top:.06em}
.ok{margin:clamp(40px,5vw,80px) 0 0;max-width:40em}
.ok .mono{margin-bottom:14px}
.lead{font-size:clamp(22px,1.7vw + 6px,34px);font-weight:600;letter-spacing:-.025em;line-height:1.15;max-width:18em;margin-bottom:16px;text-wrap:balance}
.ok .btn{margin-top:clamp(24px,3vw,40px)}
.go{display:inline-flex;align-items:center;gap:10px}
.go .ico{width:14px;height:14px}
.page{min-height:calc(100vh - 56px);min-height:calc(100dvh - 56px)}
.foot{margin-top:auto;padding-top:clamp(56px,7vw,112px)}
@media (max-width:560px){.ok .btn{width:100%}}
html.intro .mark>span{display:inline-block;--b:.1em;--s:1.04;animation:focus 2s cubic-bezier(.22,1,.36,1) .05s both paused}
html.intro .ok{--b:9px;--y:14px;animation:focus 1.7s cubic-bezier(.22,1,.36,1) .4s both paused}
html.intro.go .mark>span,html.intro.go .ok{animation-play-state:running}
</style>
</head>
<body>
<header class="bar" data-bar><nav class="bar__in mono" aria-label="Breadcrumb"><ol class="crumbs"><li><a href="index.html">Sohaib Aref</a></li><li><a href="workshops.html">Workshops</a></li></ol><a class="bar__link" href="mailto:hello@sohaib-aref.com?subject=Workshops">Contact</a></nav></header>
<main class="page">
  <h1 class="mark"><span data-fit>Confirmed</span></h1>
  <section class="ok">
    <p class="lead">You’re on the list.</p>
    <p class="txt">When dates, format and places for <span data-ws>this workshop</span> are set, you’ll hear first. I only write when there’s news.</p>
    <ol class="steps mono" aria-label="Sign-up steps"><li class="done"><span class="mk" aria-hidden="true"><svg viewBox="0 0 12 12"><path d="M2 6.5l2.6 2.6L10 3.5"/></svg></span><span>Joined</span></li><li class="done"><span class="mk" aria-hidden="true"><svg viewBox="0 0 12 12"><path d="M2 6.5l2.6 2.6L10 3.5"/></svg></span><span>Confirm by email</span></li><li class="done"><span class="mk" aria-hidden="true"><svg viewBox="0 0 12 12"><path d="M2 6.5l2.6 2.6L10 3.5"/></svg></span><span>On the list</span></li></ol>
    <a class="btn mono" href="workshops.html" data-back>All workshops<span class="arr"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12h14M12 5l7 7-7 7"/></svg></span></a>
  </section>
  <footer class="foot"><p class="mono links"><a href="index.html">Home</a><a href="mailto:hello@sohaib-aref.com?subject=Workshops">hello@sohaib-aref.com</a><a href="https://www.instagram.com/sohaib_creative/" target="_blank" rel="noopener">Instagram</a><a href="https://www.linkedin.com/in/sohaib-creative/" target="_blank" rel="noopener">LinkedIn</a></p></footer>
</main>
<script>
(function(){
  var names={"ai-video-production": "AI Video Production", "creative-directing": "Creative Directing", "motion-design": "Motion Design"},w=(location.search.match(/[?&]w=([a-z-]+)/)||[])[1];
  if(w&&names[w]){
    [].forEach.call(document.querySelectorAll('[data-ws]'),function(el){el.textContent=names[w]});
    var b=document.querySelector('[data-back]');if(b){b.href=w+'.html';b.firstChild.nodeValue=names[w]}
  }
  var el=document.querySelector('[data-fit]'),box=el.parentNode;
  function fit(){
    box.style.fontSize='100px';
    var cs=getComputedStyle(box.parentNode),wd=box.parentNode.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
    box.style.fontSize=Math.min(100*wd/el.offsetWidth*0.995,innerHeight*0.42)+'px';
  }
  fit();addEventListener('resize',fit);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
})();
</script>
<script>
(function(){
  var bar=document.querySelector('[data-bar]');if(!bar)return;
  function s(){bar.classList.toggle('scrolled',scrollY>8)}s();addEventListener('scroll',s,{passive:true});
  var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches,fine=matchMedia('(pointer:fine)').matches;
  // jump to the sign-up without adding a step to the history, so Back always leaves the page
  [].forEach.call(document.querySelectorAll('[data-scroll]'),function(a){a.addEventListener('click',function(e){
    var t=document.querySelector(a.getAttribute('href'));if(!t)return;e.preventDefault();
    t.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});
    var f=fine&&t.querySelector('input[name=name]');if(f)setTimeout(function(){f.focus({preventScroll:true})},reduce?0:700);
  })});
  // the bar's button steps aside while the page's own button or the form is on screen
  var cta=bar.querySelector('.bar__cta'),form=document.getElementById('early-list'),hero=document.querySelector('.hero .btn');
  if(cta&&form&&hero&&'IntersectionObserver' in window){
    var v={};cta.classList.add('off');
    var io=new IntersectionObserver(function(es){es.forEach(function(e){v[e.target===form?'f':'h']=e.isIntersecting});cta.classList.toggle('off',!!(v.f||v.h))});
    io.observe(form);io.observe(hero);
  }
})();
</script>
<script>
(function(){
  var h=document.documentElement,R=[].slice.call(document.querySelectorAll('.reveal'));
  if(!h.classList.contains('intro'))return;
  var d=false;function go(){if(d)return;d=true;requestAnimationFrame(function(){h.classList.add('go');watch()})}
  // each block comes into focus once, as it enters the screen
  function watch(){
    if(!('IntersectionObserver' in window)){R.forEach(function(s){s.classList.add('in')});return}
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{rootMargin:'0px 0px -8% 0px'});
    R.forEach(function(s){io.observe(s)});
  }
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(go);setTimeout(go,1600);
})();
</script>
