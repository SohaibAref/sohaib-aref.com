<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workshops, Sohaib Aref</title>
<meta name="description" content="Workshops by Sohaib Aref. No courses scheduled right now.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#000000">
<script>if(!matchMedia("(prefers-reduced-motion:reduce)").matches)document.documentElement.classList.add("intro")</script>
<style>
@font-face{font-family:Inter;src:url(fonts/inter-var.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Martian Mono";src:url(fonts/martian-mono-400.woff2) format("woff2");font-weight:400;font-display:swap}
*{box-sizing:border-box;margin:0}
body{background:#000;color:#fff;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.page{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:clamp(32px,5vw,72px);padding:40px}
.mark{font-weight:900;font-size:13.6vw;line-height:.8;letter-spacing:-.045em;text-transform:uppercase;white-space:nowrap;margin-left:-.04em;padding-top:.06em}
.mono{font-family:"Martian Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.02em;text-transform:uppercase;line-height:1.6}
.dim{color:#8a8a8a}
.body{max-width:44ch}
.body .mono{margin-bottom:12px}
.lead{font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.2;margin-bottom:14px}
.body p.txt{font-size:15px;line-height:1.55;color:#c9c9c9;text-wrap:pretty}
.foot{margin-top:auto}
.links{display:flex;gap:12px 24px;flex-wrap:wrap}
a{color:#fff;text-decoration:none;border-bottom:1px solid #444;padding-bottom:2px;transition:border-color .3s}
a:hover{border-color:#fff}
a:focus-visible{outline:1px solid #fff;outline-offset:4px}
.mask{display:block;overflow:hidden;padding-top:.14em;padding-bottom:.04em;margin-top:-.08em;margin-bottom:-.04em}
.mask>span{display:inline-block}
@keyframes rise{from{transform:translateY(112%)}to{transform:none}}
@keyframes lift{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
html.intro .mask>span{animation:rise 1.5s cubic-bezier(.16,1,.3,1) .1s both paused}
html.intro .body{animation:lift 1.3s cubic-bezier(.16,1,.3,1) .45s both paused}
html.intro .foot{animation:fade .6s linear .8s both paused}
html.intro.go .mask>span,html.intro.go .body,html.intro.go .foot{animation-play-state:running}
@media (max-width:810px){.page{padding:20px;gap:40px}}
</style>
</head>
<body>
<main class="page">
  <h1 class="mark mask"><span data-fit>Workshops</span></h1>
  <section class="body">
    <p class="mono dim">Upcoming</p>
    <p class="lead">No courses scheduled right now.</p>
    <p class="txt">When the next one is set, it will be listed here first. If you want to hear about it, write to me.</p>
  </section>
  <footer class="foot"><p class="mono links"><a href="index.html">Back</a><a href="mailto:hello@sohaib-aref.com?subject=Workshops">hello@sohaib-aref.com</a></p></footer>
</main>
<script>
(function(){
  var el=document.querySelector('[data-fit]'),box=el.parentNode;
  function fit(){
    box.style.fontSize='100px';
    var w=box.parentNode.clientWidth-parseFloat(getComputedStyle(box.parentNode).paddingLeft)-parseFloat(getComputedStyle(box.parentNode).paddingRight),r=document.createRange();
    r.selectNodeContents(el);
    box.style.fontSize=(100*w/r.getBoundingClientRect().width*0.995)+'px';
  }
  fit();window.addEventListener('resize',fit);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
})();
</script>
<script>
(function(){var h=document.documentElement;if(!h.classList.contains('intro'))return;var d=false;function go(){if(d)return;d=true;requestAnimationFrame(function(){h.classList.add('go')})}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(go);setTimeout(go,1600)})();
</script>
</body>
</html>
